<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        * {
            box-sizing: border-box;
        }

        div[class^=c] {
            width: 200px;
            height: 100px;
            background-color: blue;
            color: #fff;
            border: #000 solid 1px;
            font-size: 30px;


            /* Flex box */
            /* flex-shrink: 0; */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box{
            height: 500px;
            background-color: aqua;
            width: 700px;
            /* overflow-x: scroll ; */
            
            /* Flex Box */
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            flex-direction: row;
            gap: 5px;
        }

        /* Aplicando media queries */

        /* >= 700px*/
        @media screen and (min-width: 700px){
            .media {
                color: blue;
                font-size: 30px;
            }
        }

    </style>
</head>
<body>
    <!-- Trabalhando com media queries  -->
    <div class="media">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Repellendus, rerum.</div>

</html>
