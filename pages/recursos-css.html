<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos</title>
    <style>
       .circulo {
            width: 100px;
            height: 100px;
            background-color: blue;
            box-shadow: 5px -5px 8px #000;
            -webkit-border-radius: 10px 20px 30px 0;
            -moz-border-radius:10px 20px 30px 0;
            -o-border-radius:10px 20px 30px 0;
       } 

       .h1 {
            text-shadow: 2px 2px 5px #00067d, 2px 2px 5px #ff0000;
            text-align: center;
            border: 1px solid #0000ff;
       }

       .caixa {
            border: 1px solid #0000ff;
            text-align: justify;
            line-height: 30px;
            /* font-weight: bold; */
            /* font-size: 30px; */
            /* font-style: italic; */
            text-transform: uppercase;
            max-height: 100px;
            overflow: auto;
       }

       .caixa::-webkit-scrollbar-button {
            background: black ;
        }

        .visible-scrollbar,
        .invisible-scrollbar,
        .mostly-customized-scrollbar {
        display: block;
        width: 10em;
        overflow: auto;
        height: 2em;
        padding: 1em;
        margin: 1em auto;
        outline: 2px dashed cornflowerblue;
        }

        .invisible-scrollbar::-webkit-scrollbar {
         display: none;
        }

        /* Demonstrate a "mostly customized" scrollbar
        * (won't be visible otherwise if width/height is specified) */
        .mostly-customized-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 8px;
            background-color: #aaaaaa; /* or add it to the track */
        }

        /* Add a thumb */
        .mostly-customized-scrollbar::-webkit-scrollbar-thumb {
            background: black;
        }
        .section {
            border: #000 solid 1px;
            background:#ff0000;
            position: relative;
            height:400px
        }
        .bola {
            width: 100px;
            height: 100px;
            background: #0000ff;
            position: absolute;
            left: 50%;
            top: 20px;
            border: #000 5px solid;
            z-index: 3;
        }

         .bola2 {
            width: 100px;
            height: 100px;
            background: #f200ff;
            position: absolute;
            left: 40%;
            top: 0;
            border: #000 5px solid;
            z-index: 2;
        }

        .block {
            position: fixed;
            top:0;
            left: 0;
            background-color: #000000;
            width: 100%;
            z-index: 4;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bola-anime {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #fdfdfd;
            border: #000 5px solid;
            border-radius: 50%;
            transition-property: width, height, background;
            transition-duration: 1s, 1s;
            /* transition-delay: 2s; */
            transition-timing-function: ease-in;

            /* Animação usando keyframe */
            animation-name: bolinha;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
            animation-timing-function: ease-out;
        }

        .bola-anime:hover {
            width: 200px;
            height: 200px;
            background: #0000ff;
            cursor: pointer;
        }
        
        @keyframes bolinha {
            0% {
                background-color: #f200ff;
                top: 50%;
                left: 50%;
                /* border-radius: 50%; */
                opacity: 1;
            }

            50% {
                background-color: #000dff;
                left: 30%;
            }

            100% {
                background-color: rgb(85, 255, 0);
                top: 0;
                left: 0%;
                /* border-radius: 0; */
                opacity: 0.2;
            }
        }


        .caixa {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #fdfdfd;
            border: #000 5px solid;
            transform: rotate(0deg);

            transition-property: transform;
            transition-duration: 1s;
            z-index: 1;
        }

        .caixa2 {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #43ff49;
            border: #000 5px solid;
            transform: rotate(180deg);

            transition-property: transform;
            transition-duration: 1s;
            z-index: 2;
        }

        .caixa:hover {
            transform: rotate(180deg);
        }
        .caixa2:hover {
            transform: rotate(0deg);
            z-index: 1;
        }



    </style>
</head>
<body>
    <section class="section">

        <div class="block">
            <div class="bola-anime"></div>

            <div class="caixa"></div>
            <div class="caixa2"></div>

        </div>

        <h1 class="h1">Recuros CSS</h1>
