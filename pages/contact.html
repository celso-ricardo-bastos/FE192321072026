        <div class="container">
            
            <!-- Button trigger modal -->
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                Login
            </button>

            <!-- Modal -->
            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Sair</button>
                    <button type="button" class="btn btn-primary">Logar</button>
                </div>
                </div>
            </div>
            </div>


            <h1 class="text-start text-lg-center">Contact Us</h1>
            <form id="form-contact" action="http://localhost:3001/form-contato" method="post">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input class="form-control" type="text" id="nome" name="nome" placeholder="Digite seu nome">
                    <div class="alert alert-danger" data-js="aviso" style="display: none;">

                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input class="form-control" type="email" id="email" name="email">
                </div>

                <div class="mb-3">
                    <label for="cep" class="form-label">Cep:</label>
                    <input class="form-control" type="text" id="cep" name="cep" placeholder="Digite o cep">
                </div>

                <div class="mb-3">
                    <label for="logradouro" class="form-label">Logradouro:</label>
                    <input class="form-control" type="text" id="logradouro" name="logradouro" placeholder="Digite o logradouro">
                </div>

                <div>
                    <label for="estado" class="form-label">Estado:</label>
                    <select name="estado" id="estado" class="form-control">
                        <option value=""> Selecione um estado </option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </select>
                </div>

                <div class="mb-3">
                    <div>
                        <label for="mensagem"  class="form-label">Mensagem:</label>
                    </div>
                    <div>
                        <textarea class="form-control" id="mensagem" name="mensagem" rows="4" cols="50" maxlength="10"></textarea>
                    </div>
                </div>

                <div class="mb-3 row">
                    <div class="col-2">
                        <input data-js="submit" type="submit" value="Enviar" class="btn btn-primary">
                    </div>
                    <div class="col-3">
                        <input type="reset" value="Limpar" class="btn btn-primary">
                    </div>
                </div>


                <!-- <input type="checkbox" name="EN" value="ingles">EN
                <input type="checkbox" name="PT">PT
                <input type="checkbox" name="ES">ES -->
            </form>
